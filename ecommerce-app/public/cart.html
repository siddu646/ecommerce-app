<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart &mdash; Fieldstone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand">Field<span>stone</span></a>
    <nav class="main-nav">
      <a href="/index.html">Shop</a>
      <div id="nav-auth"></div>
      <a href="/cart.html" class="cart-pill">Cart &middot; <span id="nav-cart-count">0</span></a>
    </nav>
  </div>
</header>

<div class="container">
  <h1 style="margin-top:36px;">Your Cart</h1>
  <div id="alert-slot"></div>

  <div id="cart-empty" class="empty-state" style="display:none;">
    Your cart is empty. <a href="/index.html" style="text-decoration:underline;">Browse products</a>.
  </div>

  <table class="cart-table" id="cart-table" style="display:none;">
    <thead>
      <tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
    </thead>
    <tbody id="cart-body"></tbody>
  </table>

  <div id="cart-summary-wrap" style="display:none;">
    <div class="cart-summary">
      <div class="row"><span>Subtotal</span><span id="cart-total">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="cart-total-2">$0.00</span></div>
    </div>
  </div>

  <div id="checkout-section" style="display:none; max-width: 420px; margin: 32px auto 64px;">
    <div class="form-card" style="margin: 0;">
      <h2 style="font-size:1.2rem;">Shipping details</h2>
      <div id="checkout-alert"></div>
      <form id="checkout-form">
        <div class="field">
          <label for="shippingName">Full name</label>
          <input type="text" id="shippingName" required>
        </div>
        <div class="field">
          <label for="shippingAddress">Shipping address</label>
          <textarea id="shippingAddress" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Place order</button>
      </form>
      <p class="form-note" id="login-note" style="display:none;">
        <a href="/login.html?next=/cart.html" style="text-decoration:underline;">Log in</a> to complete checkout.
      </p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">Fieldstone &mdash; a demo store built for learning purposes.</div>
</footer>

<script src="/js/nav.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
