<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &mdash; Fieldstone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand">Field<span>stone</span></a>
    <nav class="main-nav">
      <a href="/index.html">Shop</a>
      <div id="nav-auth"></div>
      <a href="/cart.html" class="cart-pill">Cart &middot; <span id="nav-cart-count">0</span></a>
    </nav>
  </div>
</header>

<div class="form-card">
  <h1>Create an account</h1>
  <div id="form-alert"></div>
  <form id="register-form">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" required autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="form-note">Already have an account? <a href="/login.html" style="text-decoration:underline;">Log in</a></p>
</div>

<script src="/js/nav.js"></script>
<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      document.getElementById('form-alert').innerHTML =
        `<div class="alert alert-error">${escapeHtml(data.error)}</div>`;
      return;
    }

    window.location.href = '/index.html';
  });
</script>
</body>
</html>
